# 클러스터 내부 고정 주소 + Pod 2개로의 로드밸런싱
apiVersion: v1
kind: Service
metadata:
  name: chaeeon-cv
  labels:
    app: chaeeon-cv
    app.kubernetes.io/name: chaeeon-cv
    app.kubernetes.io/part-of: chaeeon-portfolio
spec:
  type: ClusterIP
  selector:
    app: chaeeon-cv          # Deployment 의 Pod label 과 일치
  ports:
    - name: http
      port: 8080
      targetPort: http       # 컨테이너 포트 이름(8080)
      protocol: TCP
