apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaeeon-portfolio
  labels:
    app: chaeeon-portfolio
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: chaeeon-portfolio
  template:
    metadata:
      labels:
        app: chaeeon-portfolio
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: site-content
              mountPath: /opt/app-root/src/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: site-content
          configMap:
            name: chaeeon-portfolio-content
            defaultMode: 0444
