<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeo ChaeEon · Portfolio</title>
<meta name="description" content="Yeo ChaeEon — robot learning, reinforcement learning, Sim2Real. Interactive terminal portfolio served from an OpenShift pod.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────
   색 이름은 로봇 좌표계(X=red, Y=green, Z=blue)에서 가져왔습니다. */
:root, [data-theme="sim"] {
  --bg: #1b2230;          /* 시뮬레이터 뷰포트 */
  --grid: #273145;
  --surface: #222b3b;
  --line: #34405a;
  --text: #d7dee8;
  --muted: #8a97ab;
  --x: #f2665c;           /* X axis — 오류, 강조 */
  --y: #7bd88f;           /* Y axis — 경로, 성공 */
  --z: #6cb6ff;           /* Z axis — 사용자, 링크 */
  --pod: #f5c46b;         /* 쿠버네티스 런타임 정보 */
  --sel: rgba(108,182,255,.25);
}
[data-theme="paper"] {
  --bg: #eef1f5; --grid: #dde3ea; --surface: #ffffff; --line: #c9d1dc;
  --text: #1d2633; --muted: #5b6878;
  --x: #c6362c; --y: #1f8a43; --z: #1f63c2; --pod: #9a6500;
  --sel: rgba(31,99,194,.18);
}
[data-theme="phosphor"] {
  --bg: #050d07; --grid: #0b1a0f; --surface: #08140b; --line: #12361c;
  --text: #9cf0ad; --muted: #4f9a62;
  --x: #ff7a6b; --y: #9cf0ad; --z: #c8ffd2; --pod: #e7ff8a;
  --sel: rgba(156,240,173,.2);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  /* MuJoCo / Isaac Sim 바닥 그리드 */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--text);
  font: 15px/1.6 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--sel); }
a { color: var(--z); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, .cmd:focus-visible { outline: 2px solid var(--z); outline-offset: 2px; border-radius: 3px; }

/* ── Window chrome ─────────────────────────────────── */
.app { height: 100dvh; display: flex; flex-direction: column; max-width: 1080px; margin: 0 auto; padding: 16px; }
.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px 10px 0 0; border-bottom: none;
}
.gizmo { width: 22px; height: 22px; flex: none; }
.title { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title b { color: var(--text); font-weight: 500; }
.title .pod { color: var(--pod); }
.switch { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.switch button {
  font: inherit; font-size: 12.5px; color: var(--muted); background: transparent;
  border: 0; padding: 4px 12px; cursor: pointer;
}
.switch button[aria-pressed="true"] { background: var(--line); color: var(--text); }

.window {
  flex: 1; min-height: 0; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line); border-radius: 0 0 10px 10px;
  backdrop-filter: blur(2px);
}

/* ── Terminal ──────────────────────────────────────── */
.term { height: 100%; overflow-y: auto; padding: 18px 20px 12px; cursor: text; scrollbar-color: var(--line) transparent; }
.term .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
.banner { color: var(--z); line-height: 1.2; font-size: 14px; margin: 2px 0 10px; white-space: pre; }
.banner.small { display: none; }
.prompt { color: var(--muted); }
.prompt .u { color: var(--z); }
.prompt .p { color: var(--y); }
.echo { color: var(--text); }
.dim { color: var(--muted); }
.err { color: var(--x); }
.ok { color: var(--y); }
.podc { color: var(--pod); }
.h { color: var(--text); font-weight: 600; }
.cmd { color: var(--z); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.cmd:hover { text-decoration-style: solid; }
.tag { color: var(--muted); }
.tbl { display: grid; gap: 0 18px; margin: 2px 0; }
.indent { padding-left: 2ch; }
.block { margin: 4px 0 10px; }
.bullet { display: grid; grid-template-columns: 2ch 1fr; }

.inputrow { display: flex; align-items: baseline; gap: 1ch; }
.inputrow input {
  flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent;
  border: 0; outline: 0; padding: 0; caret-color: var(--y);
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0 2px; }
.chips button {
  font: inherit; font-size: 12.5px; color: var(--text); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer;
}
.chips button:hover { border-color: var(--z); color: var(--z); }

/* ── Portfolio (GUI) ───────────────────────────────── */
.gui { height: 100%; overflow-y: auto; display: none; word-break: keep-all; overflow-wrap: anywhere; font-family: "IBM Plex Sans KR", system-ui, sans-serif; font-size: 16px; line-height: 1.65; }
.mode-gui .gui { display: block; }
.mode-gui .term { display: none; }
.gui-inner { max-width: 760px; padding: 48px 32px 56px; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: start; margin-bottom: 44px; }
.hero .gizmo { width: 64px; height: 64px; grid-row: span 3; margin-top: 6px; }
.hero h1 { margin: 0; font-size: 40px; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; }
.hero h1 small { display: block; font-size: 17px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-top: 6px; }
.hero p { margin: 0; max-width: 56ch; }
.hero .links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: "IBM Plex Mono", monospace; font-size: 14px; margin-top: 6px; }
.gui section { margin-top: 40px; }
.gui h2 {
  font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 500; color: var(--y);
  margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.gui h2::before { content: "~/"; color: var(--muted); }
.gui h3 { margin: 0; font-size: 17px; font-weight: 600; }
.meta { color: var(--muted); font-size: 14px; }
.gui ul { margin: 8px 0 0; padding-left: 1.1em; }
.gui li { margin: 3px 0; }
.gui li::marker { color: var(--muted); }
.timeline { border-left: 2px solid var(--line); padding-left: 22px; display: grid; gap: 28px; }
.timeline > div { position: relative; }
.timeline > div::before {
  content: ""; position: absolute; left: -29px; top: 7px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--bg); border: 2px solid var(--z);
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tags span { font: 12.5px "IBM Plex Mono", monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
.proj { display: grid; gap: 22px; }
.proj > div { display: grid; grid-template-columns: 10ch 1fr; gap: 0 16px; }
.proj .yr { font: 13.5px/1.9 "IBM Plex Mono", monospace; color: var(--muted); }
.skills { display: grid; grid-template-columns: 14ch 1fr; gap: 8px 16px; }
.skills dt { color: var(--muted); font-size: 14px; padding-top: 2px; }
.skills dd { margin: 0; }
.runtime {
  margin-top: 48px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 8px;
  font: 13px/1.7 "IBM Plex Mono", monospace; color: var(--muted);
}
.runtime b { color: var(--pod); font-weight: 500; }
.runtime button { font: inherit; color: var(--z); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

@media (max-width: 720px) {
  .app { padding: 0; }
  .bar { border-radius: 0; border-left: 0; border-right: 0; }
  .window { border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; }
  body { font-size: 14px; }
  .term { padding: 14px 16px 10px; }
  .banner.big { display: none; }
  .banner.small { display: block; }
  .gui-inner { padding: 32px 16px 48px; }
  .hero { grid-template-columns: 1fr; }
  .hero .gizmo { grid-row: auto; width: 44px; height: 44px; }
  .hero h1 { font-size: 30px; }
  .proj > div, .skills { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <svg class="gizmo" viewBox="0 0 24 24" aria-hidden="true">
      <line x1="8" y1="16" x2="21" y2="16" stroke="var(--x)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="8" y1="16" x2="8" y2="3" stroke="var(--z)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="8" y1="16" x2="2.5" y2="21.5" stroke="var(--y)" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="title" id="title"><b>chaeeon@portfolio</b> — <span class="pod" id="titlePod">connecting…</span></div>
    <div class="switch" role="group" aria-label="보기 방식">
      <button type="button" id="btnTerm" aria-pressed="true">Terminal</button>
      <button type="button" id="btnGui" aria-pressed="false">Portfolio</button>
    </div>
  </header>

  <main class="window">
    <div class="term" id="term" aria-live="polite">
      <div id="out"></div>
      <form class="inputrow" id="form" autocomplete="off">
        <label class="prompt" id="promptLabel" for="cmd"></label>
        <input id="cmd" type="text" spellcheck="false" autocapitalize="off" aria-label="명령어 입력">
      </form>
      <div class="chips" id="chips"></div>
    </div>
    <div class="gui" id="gui"><div class="gui-inner" id="guiInner"></div></div>
  </main>
</div>

<script>
(() => {
"use strict";

/* ── tiny DOM helper (데이터는 항상 textContent 로 넣어 XSS 방지) ── */
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
};
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise(r => setTimeout(r, reduced ? 0 : ms));

const out = $("out"), term = $("term"), input = $("cmd"), form = $("form");
let P = null;              // profile.json
let INFO = null;           // /api/info (마지막 응답)
let cwd = "~";
const hist = []; let hIdx = 0;
let pending = null;        // sudo 비밀번호 입력 대기

/* ── API ─────────────────────────────────────────── */
const api = async (path, opt) => {
  const r = await fetch(path, { cache: "no-store", ...opt });
  const body = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, body };
};
async function refreshInfo() {
  try { const r = await api("/api/info"); if (r.ok) { INFO = r.body; paintTitle(); } } catch {}
  return INFO;
}
function paintTitle() {
  $("titlePod").textContent = INFO ? `pod/${INFO.podName}` : "offline";
  setPrompt();
}

/* ── terminal output ─────────────────────────────── */
const line = (...kids) => { const el = h("div", { class: "ln" }, ...kids); out.append(el); return el; };
const blank = () => line("");
const span = (cls, t) => h("span", { class: cls }, t);
const cmdLink = (c, label) => h("span", {
  class: "cmd", tabindex: "0", role: "button",
  onclick: (e) => { e.stopPropagation(); run(c); },
  onkeydown: (e) => { if (e.key === "Enter") run(c); }
}, label || c);
const link = (url, label) => h("a", { href: url, target: "_blank", rel: "noopener" }, label || url);
const bullets = (arr, cls = "") => arr.forEach(t => line(h("span", { class: "bullet " + cls }, span("dim", "•"), h("span", {}, t))));
const scroll = () => { term.scrollTop = term.scrollHeight; };

function promptNode() {
  return h("span", { class: "prompt" },
    span("u", "guest@chaeeon"), ":", span("p", cwd), "$");
}
function setPrompt() {
  const l = $("promptLabel"); l.replaceChildren(pending ? span("dim", "[sudo] password for guest:") : promptNode());
  input.type = pending ? "password" : "text";
}

/* ── 파일 시스템 흉내 ─────────────────────────────── */
const FS = {
  "~": ["about.txt", "contact.txt", "research/", "experience/", "projects/", "skills.txt", "awards.txt", ".secret"],
  "~/research": ["interests.txt", "expertise.txt"],
  "~/experience": () => P.experience.map(e => e.id + ".md"),
  "~/projects": () => P.projects.map(p => p.id + ".md")
};
const fileCmd = {
  "about.txt": "about", "contact.txt": "contact", "skills.txt": "skills", "awards.txt": "awards",
  "interests.txt": "research", "expertise.txt": "research", ".secret": "sudo cat .secret"
};

/* ── commands ────────────────────────────────────── */
const C = {};
const HELP = [
  ["about", "자기소개 (whoami)"],
  ["research", "연구 관심 분야"],
  ["experience [id]", "연구·활동 경력"],
  ["projects [id]", "프로젝트"],
  ["skills", "기술 스택"],
  ["awards", "수상·장학"],
  ["education", "학력"],
  ["contact", "연락처 / GitHub"],
  ["gui", "일반 포트폴리오 화면으로 보기"],
  ["", ""],
  ["neofetch", "이 페이지를 실행 중인 Pod 정보"],
  ["oc get pod", "응답한 Pod 조회 (Downward API)"],
  ["lb [n]", "n번 요청해 로드밸런싱 확인"],
  ["sudo <cmd>", "관리자 전용 (Secret 비밀번호)"],
  ["theme [sim|paper|phosphor]", "색 테마 변경"],
  ["ls · cd · cat · clear · history", "기본 셸 명령"]
];

C.help = () => {
  line(span("h", "Available commands"));
  const t = h("div", { class: "tbl", style: "grid-template-columns: max-content 1fr" });
  for (const [c, d] of HELP) {
    if (!c) { t.append(h("div", {}, " "), h("div", {}, " ")); continue; }
    const base = c.split(/[ [<]/)[0];
    t.append(h("div", {}, cmdLink(c.includes("[") || c.includes("<") || c.includes("·") ? base : c, c)), span("dim", d));
  }
  out.append(t);
  line(span("dim", "Tab 자동완성 · ↑↓ 이전 명령 · Ctrl+L 화면 지우기"));
};

C.about = C.whoami = () => {
  line(span("h", `${P.name} (${P.nameKo})`));
  line(span("dim", P.education[0].degree + " · " + P.education[0].school));
  blank();
  line(P.tagline);
  line(span("dim", P.taglineKo));
  blank();
  line("Focus  ", span("ok", P.expertise.join(", ")));
  line("Now    ", P.experience[0].role + " @ " + P.experience[0].org.split(",")[0]);
  blank();
  line(span("dim", "next → "), cmdLink("research"), "  ", cmdLink("experience"), "  ", cmdLink("projects"), "  ", cmdLink("contact"));
};

C.education = () => {
  for (const e of P.education) {
    line(span("h", e.school), span("dim", "  " + e.place));
    line(e.degree, span("dim", "  " + e.period));
    line(span("dim", e.note));
  }
};

C.research = () => {
  line(span("h", "Research interests"));
  bullets(P.interests);
  blank();
  line(span("h", "Areas of expertise"));
  line(span("ok", P.expertise.join("  ·  ")));
};

function showExp(e) {
  line(span("h", e.role), span("dim", "  " + e.period));
  line(span("dim", e.org));
  bullets(e.points);
  line(span("tag", e.tags.map(t => "#" + t.replace(/\s+/g, "")).join(" ")));
}
C.experience = (args) => {
  const id = args[0];
  if (id) {
    const e = P.experience.find(x => x.id === id.replace(/\.md$/, ""));
    if (!e) return line(span("err", `experience: '${id}' not found. `), "try ", cmdLink("experience"));
    return showExp(e);
  }
  P.experience.forEach((e, i) => { if (i) blank(); showExp(e); });
};

function showProj(p, full) {
  line(span("h", p.name), span("dim", `  ${p.period} · ${p.role}`));
  line(p.summary);
  if (full) bullets(p.points);
  if (p.link) line(span("dim", "repo  "), link(p.link));
  if (full) line(span("tag", p.tags.map(t => "#" + t.replace(/\s+/g, "")).join(" ")));
}
C.projects = (args) => {
  const id = args[0];
  if (id) {
    const p = P.projects.find(x => x.id === id.replace(/\.md$/, ""));
    if (!p) return line(span("err", `projects: '${id}' not found. `), "try ", cmdLink("projects"));
    return showProj(p, true);
  }
  P.projects.forEach((p, i) => { if (i) blank(); showProj(p, false); line(span("dim", "more  "), cmdLink("projects " + p.id)); });
};

C.skills = () => {
  const t = h("div", { class: "tbl", style: "grid-template-columns: max-content 1fr" });
  for (const [k, v] of Object.entries(P.skills)) t.append(span("dim", k), h("div", {}, v.join(", ")));
  out.append(t);
};

C.awards = () => {
  for (const a of P.awards) line(span("pod", "★ "), a.title, span("dim", `  ${a.year}`));
  blank();
  line(span("h", "Activities"));
  bullets(P.activities);
};

C.contact = () => {
  line("email   ", link("mailto:" + P.contact.email, P.contact.email));
  line("github  ", link(P.contact.github));
};
C.github = () => { line("opening ", link(P.contact.github), " …"); window.open(P.contact.github, "_blank", "noopener"); };
C.email = () => { location.href = "mailto:" + P.contact.email; line("mailto:" + P.contact.email); };

C.gui = C.portfolio = () => { setMode("gui"); };
C.term = () => line(span("dim", "이미 터미널입니다."));

C.theme = (args) => {
  const t = args[0];
  const ok = ["sim", "paper", "phosphor"];
  if (!t) return line("current: ", span("ok", document.documentElement.dataset.theme), span("dim", "   options: "), ...ok.flatMap(o => [cmdLink("theme " + o, o), " "]));
  if (!ok.includes(t)) return line(span("err", `theme: unknown '${t}'`));
  applyTheme(t); store.set("theme", t); line("theme → ", span("ok", t));
};

C.clear = () => { out.replaceChildren(); };
C.history = () => hist.forEach((c, i) => line(span("dim", String(i + 1).padStart(4) + "  "), c));
C.date = () => line(new Date().toString());
C.echo = (args) => line(args.join(" "));
C.pwd = () => line("/home/guest" + cwd.slice(1));
C.banner = () => printBanner();
C.exit = C.logout = () => line(span("dim", "브라우저 탭은 직접 닫아주세요 :)"));

C.ls = (args) => {
  const target = args.find(a => !a.startsWith("-"));
  let dir = cwd;
  if (target) dir = target === "~" || target === "/" ? "~" : (cwd === "~" ? "~/" : cwd + "/") + target.replace(/\/$/, "");
  if (dir.startsWith("~/~")) dir = dir.slice(2);
  let list = FS[dir];
  if (!list) return line(span("err", `ls: cannot access '${target}': No such file or directory`));
  if (typeof list === "function") list = list();
  const showHidden = args.some(a => a.startsWith("-") && a.includes("a"));
  const items = list.filter(f => showHidden || !f.startsWith("."));
  line(...items.flatMap(f => [f.endsWith("/") ? cmdLink("cd " + f.slice(0, -1), f) : cmdLink("cat " + f, f), "   "]));
};

C.cd = (args) => {
  const t = (args[0] || "~").replace(/\/$/, "");
  if (t === "~" || t === "/" || (t === ".." && cwd !== "~")) cwd = "~";
  else if (t === "..") cwd = "~";
  else {
    const next = (cwd === "~" ? "~/" : cwd + "/") + t;
    if (!FS[next]) return line(span("err", `cd: no such directory: ${t}`));
    cwd = next;
  }
  setPrompt();
  C.ls([]);
};

C.cat = (args) => {
  const f = args[0];
  if (!f) return line(span("err", "cat: missing file operand"));
  const name = f.split("/").pop();
  if (fileCmd[name]) return run(fileCmd[name], true);
  const id = name.replace(/\.md$/, "");
  if (P.projects.some(p => p.id === id)) return C.projects([id]);
  if (P.experience.some(e => e.id === id)) return C.experience([id]);
  line(span("err", `cat: ${f}: No such file or directory`));
};

/* ── Kubernetes / OpenShift 관련 명령 ───────────────── */
const fmtUp = (s) => s >= 86400 ? `${Math.floor(s / 86400)}d${Math.floor(s % 86400 / 3600)}h` : s >= 3600 ? `${Math.floor(s / 3600)}h${Math.floor(s % 3600 / 60)}m` : s >= 60 ? `${Math.floor(s / 60)}m${s % 60}s` : `${s}s`;

C.hostname = async () => { const i = await refreshInfo(); line(i ? span("podc", i.podName) : span("err", "unreachable")); };

C.oc = C.kubectl = async (args, raw) => {
  const sub = args.join(" ");
  const i = await refreshInfo();
  if (!i) return line(span("err", "error: unable to reach /api/info"));
  if (/^get (po|pod|pods)\b/.test(sub)) {
    const t = h("div", { class: "tbl", style: "grid-template-columns: repeat(5, max-content)" });
    ["NAME", "READY", "STATUS", "RESTARTS", "AGE"].forEach(x => t.append(span("dim", x)));
    t.append(span("podc", i.podName), h("div", {}, "1/1"), span("ok", "Running"), h("div", {}, "0"), h("div", {}, fmtUp(i.uptimeSeconds)));
    out.append(t);
    line(span("dim", "※ 이 요청에 응답한 Pod만 보입니다. 여러 번 실행하거나 "), cmdLink("lb 10"), span("dim", " 으로 다른 Pod를 확인해 보세요."));
    return;
  }
  if (/^describe (po|pod|pods)\b/.test(sub)) {
    const rows = [["Name", i.podName], ["Namespace", i.namespace], ["Node", i.nodeName], ["IP", i.podIP],
      ["Limits", `cpu ${i.cpuLimit}m, memory ${i.memoryLimit}Mi`], ["Runtime", `Python ${i.python}`], ["Requests served", i.requestsServed]];
    const t = h("div", { class: "tbl", style: "grid-template-columns: max-content 1fr" });
    rows.forEach(([k, v]) => t.append(span("dim", k + ":"), h("div", {}, String(v))));
    out.append(t);
    return;
  }
  if (/^(project|whoami)\b/.test(sub)) return line(`Using project "${i.namespace}".`);
  line(span("dim", "supported: "), cmdLink(raw.split(" ")[0] + " get pod"), "  ", cmdLink(raw.split(" ")[0] + " describe pod"), "  ", cmdLink(raw.split(" ")[0] + " project"));
};

C.curl = async (args) => {
  const url = args.find(a => a.startsWith("/")) || "/api/info";
  if (!["/api/info", "/api/profile", "/healthz", "/readyz"].includes(url)) return line(span("err", `curl: try /api/info, /healthz, /readyz`));
  try {
    const r = await api(url);
    line(span(r.ok ? "dim" : "err", `HTTP ${r.status}`));
    line(JSON.stringify(r.body, null, 2));
  } catch { line(span("err", "curl: (7) Failed to connect")); }
};

C.neofetch = async () => {
  const i = await refreshInfo();
  const logo = ["      ▲ z", "      │", "      │", "      ●───── x", "     ╱", "    ╱ y"];
  const info = i ? [
    [span("u", "guest"), "@", span("podc", i.podName)],
    [span("dim", "─".repeat(Math.min(32, 6 + i.podName.length)))],
    [span("ok", "Owner     "), `${P.name} (${P.nameKo})`],
    [span("ok", "Platform  "), "Red Hat OpenShift (Developer Sandbox)"],
    [span("ok", "Namespace "), i.namespace],
    [span("ok", "Node      "), i.nodeName],
    [span("ok", "Pod IP    "), i.podIP],
    [span("ok", "Image     "), "ubi9/python-311"],
    [span("ok", "Runtime   "), `Python ${i.python}`],
    [span("ok", "Limits    "), `cpu ${i.cpuLimit}m · mem ${i.memoryLimit}Mi`],
    [span("ok", "Uptime    "), fmtUp(i.uptimeSeconds)],
    [span("ok", "Requests  "), String(i.requestsServed)]
  ] : [[span("err", "pod info unavailable")]];
  const t = h("div", { class: "tbl", style: "grid-template-columns: max-content 1fr; gap: 0 28px" });
  const left = h("div", { style: "white-space:pre; color: var(--z)" }, logo.join("\n"));
  const right = h("div", {}, ...info.map(r => h("div", {}, ...r)));
  t.append(left, right);
  out.append(t);
};

C.lb = async (args) => {
  const n = Math.max(2, Math.min(30, parseInt(args[0] || "10", 10) || 10));
  line(span("dim", `GET /api/info × ${n}  (Route → Service → Pods)`));
  const seen = new Map();
  const bar = line("");
  for (let k = 0; k < n; k++) {
    try {
      const r = await api("/api/info");
      const name = r.body.podName || "?";
      seen.set(name, (seen.get(name) || 0) + 1);
      INFO = r.body;
    } catch { seen.set("error", (seen.get("error") || 0) + 1); }
    bar.textContent = "▮".repeat(k + 1) + "▯".repeat(n - k - 1);
    scroll();
  }
  paintTitle();
  const max = Math.max(...seen.values());
  for (const [name, c] of seen) line(span("podc", name.padEnd(36)), " ", span("ok", "█".repeat(Math.round(c / max * 20))), span("dim", ` ${c}`));
  line(span("dim", seen.size > 1
    ? `→ ${seen.size}개의 Pod가 요청을 나눠 처리했습니다.`
    : "→ Pod 1개가 모두 응답했습니다. (replicas가 1이거나 다른 Pod가 아직 준비 중일 수 있어요)"));
};

C.sudo = (args) => {
  if (!args.length) return line(span("dim", "usage: sudo <command>   e.g. "), cmdLink("sudo cat .secret"));
  if (INFO && !INFO.sudoEnabled) return line(span("err", "sudo: not configured on this pod"));
  pending = args.join(" ");
  setPrompt();
};
async function finishSudo(pw) {
  const cmdText = pending; pending = null; setPrompt();
  line(promptNodeSudo());
  try {
    const r = await api("/api/sudo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) });
    if (r.ok && r.body.ok) {
      line(span("ok", `✓ authenticated  `), span("dim", `(${cmdText})`));
      blank();
      for (const l of String(r.body.message).split("\n")) line(span("podc", l));
    } else {
      line(span("err", r.body.error || "Sorry, try again."));
      if (r.status === 401) line(span("dim", "guest is not in the sudoers file. This incident will be reported. 🙂"));
    }
  } catch { line(span("err", "sudo: request failed")); }
}
const promptNodeSudo = () => h("span", { class: "prompt" }, "[sudo] password for guest: ", span("dim", "••••••••"));

C["rm"] = (args) => line(args.join(" ").includes("-rf") ? span("err", "rm: 그건 안 돼요. 이 Pod는 Deployment가 다시 살려냅니다 😉") : span("err", "rm: permission denied"));
C.vim = C.nano = C.emacs = () => line(span("dim", "편집기는 없어요. 내용은 ConfigMap(profile.json)에서 관리합니다."));
C.ping = () => C.lb(["4"]);
C.uptime = async () => { const i = await refreshInfo(); line(i ? `up ${fmtUp(i.uptimeSeconds)}, ${i.requestsServed} requests served by ${i.podName}` : span("err", "unavailable")); };

/* ── dispatcher ─────────────────────────────────── */
const ALIASES = { "?": "help", man: "help", info: "neofetch", k: "kubectl", exp: "experience", proj: "projects", project: "projects" };
function levenshtein(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

async function run(raw, silent = false) {
  raw = raw.trim();
  if (!silent) {
    line(promptNode(), " ", span("echo", raw));
    if (raw) { hist.push(raw); hIdx = hist.length; }
  }
  if (!raw) return scroll();
  const [c0, ...args] = raw.split(/\s+/);
  const c = ALIASES[c0] || c0.toLowerCase();
  const fn = Object.prototype.hasOwnProperty.call(C, c) ? C[c] : null;
  if (!fn) {
    const best = Object.keys(C).map(k => [k, levenshtein(c, k)]).sort((a, b) => a[1] - b[1])[0];
    line(span("err", `command not found: ${c0}`), best && best[1] <= 2 ? h("span", {}, "  did you mean ", cmdLink(best[0]), "?") : h("span", {}, "  type ", cmdLink("help")));
  } else {
    if (!P && !["help", "clear", "theme", "date", "echo", "history"].includes(c)) {
      line(span("err", "profile not loaded yet — /api/profile 를 확인하세요."));
    } else {
      try { await fn(args, raw); } catch (e) { line(span("err", "error: " + e.message)); }
    }
  }
  if (!silent && !pending) blank();
  scroll();
}

/* ── input handling ──────────────────────────────── */
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = input.value; input.value = "";
  if (pending) return finishSudo(v).then(() => { blank(); scroll(); });
  run(v);
});
input.addEventListener("keydown", (e) => {
  if (pending) { if (e.key === "Escape" || (e.ctrlKey && e.key === "c")) { e.preventDefault(); pending = null; setPrompt(); line(span("dim", "^C")); } return; }
  if (e.key === "ArrowUp") { e.preventDefault(); if (hIdx > 0) input.value = hist[--hIdx]; }
  else if (e.key === "ArrowDown") { e.preventDefault(); hIdx = Math.min(hist.length, hIdx + 1); input.value = hist[hIdx] || ""; }
  else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); C.clear(); }
  else if (e.key === "Tab") { e.preventDefault(); complete(); }
});
function complete() {
  const v = input.value; const parts = v.split(" ");
  let pool;
  if (parts.length === 1) pool = Object.keys(C).filter(k => k !== "rm");
  else {
    const c = ALIASES[parts[0]] || parts[0];
    if (c === "projects") pool = P ? P.projects.map(p => p.id) : [];
    else if (c === "experience") pool = P ? P.experience.map(e => e.id) : [];
    else if (c === "theme") pool = ["sim", "paper", "phosphor"];
    else if (c === "oc" || c === "kubectl") pool = ["get pod", "describe pod", "project"];
    else if (c === "cat" || c === "cd" || c === "ls") { let l = FS[cwd]; pool = typeof l === "function" ? l() : (l || []); if (c === "cd") pool = pool.filter(f => f.endsWith("/")).map(f => f.slice(0, -1)); }
    else pool = [];
  }
  const head = parts.length === 1 ? "" : parts[0] + " ";
  const cur = parts.length === 1 ? parts[0] : parts.slice(1).join(" ");
  const m = pool.filter(x => x.startsWith(cur));
  if (m.length === 1) input.value = head + m[0] + (parts.length === 1 ? " " : "");
  else if (m.length > 1) {
    let pre = m[0]; for (const x of m) while (!x.startsWith(pre)) pre = pre.slice(0, -1);
    input.value = head + pre;
    line(promptNode(), " ", span("echo", v)); line(span("dim", m.join("   "))); scroll();
  }
}
term.addEventListener("click", () => { if (!getSelection().toString()) input.focus({ preventScroll: true }); });

const CHIPS = ["help", "about", "research", "experience", "projects", "skills", "contact", "neofetch", "lb 10"];
$("chips").append(...CHIPS.map(c => h("button", { type: "button", onclick: (e) => { e.stopPropagation(); run(c); input.focus({ preventScroll: true }); } }, c)));

/* ── mode / theme ────────────────────────────────── */
function applyTheme(t) { document.documentElement.dataset.theme = t; }
function setMode(m) {
  const gui = m === "gui";
  $("app").classList.toggle("mode-gui", gui);
  $("btnTerm").setAttribute("aria-pressed", String(!gui));
  $("btnGui").setAttribute("aria-pressed", String(gui));
  history.replaceState(null, "", gui ? "#portfolio" : location.pathname);
  if (gui) { renderGui(); $("gui").scrollTop = 0; }
  else input.focus({ preventScroll: true });
}
$("btnTerm").onclick = () => setMode("term");
$("btnGui").onclick = () => setMode("gui");

/* ── Portfolio (GUI) 렌더링 ───────────────────────── */
function renderGui() {
  if (!P) return;
  const g = $("guiInner");
  const tagRow = (tags) => h("div", { class: "tags" }, ...tags.map(t => h("span", {}, t)));
  g.replaceChildren(
    h("div", { class: "hero" },
      document.querySelector(".bar .gizmo").cloneNode(true),
      h("h1", {}, P.name, h("small", {}, `${P.nameKo} · ${P.education[0].degree.replace("B.S. Candidate, ", "")}, ${P.education[0].school}`)),
      h("p", {}, P.tagline, h("br"), h("span", { class: "meta" }, P.taglineKo)),
      h("div", { class: "links" },
        link("mailto:" + P.contact.email, P.contact.email),
        link(P.contact.github, P.contact.github.replace("https://", "")))
    ),
    h("section", {}, h("h2", {}, "research"),
      h("ul", {}, ...P.interests.map(t => h("li", {}, t))),
      tagRow(P.expertise)),
    h("section", {}, h("h2", {}, "experience"),
      h("div", { class: "timeline" }, ...P.experience.map(e => h("div", {},
        h("h3", {}, e.role), h("div", { class: "meta" }, `${e.org} · ${e.period}`),
        h("ul", {}, ...e.points.map(p => h("li", {}, p))), tagRow(e.tags))))),
    h("section", {}, h("h2", {}, "projects"),
      h("div", { class: "proj" }, ...P.projects.map(p => h("div", {},
        h("div", { class: "yr" }, p.period),
        h("div", {},
          h("h3", {}, p.name), h("div", { class: "meta" }, p.role),
          h("p", { style: "margin:6px 0 0" }, p.summary),
          h("ul", {}, ...p.points.map(x => h("li", {}, x))),
          p.link ? h("div", { style: "margin-top:6px; font: 14px 'IBM Plex Mono', monospace" }, link(p.link, p.link.replace("https://github.com/", "github/"))) : null))))),
    h("section", {}, h("h2", {}, "skills"),
      h("dl", { class: "skills" }, ...Object.entries(P.skills).flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v.join(", "))]))),
    h("section", {}, h("h2", {}, "awards"),
      h("ul", {}, ...P.awards.map(a => h("li", {}, a.title, h("span", { class: "meta" }, `  ${a.year}`))))),
    h("section", {}, h("h2", {}, "education"),
      ...P.education.map(e => h("div", {}, h("h3", {}, e.school), h("div", { class: "meta" }, `${e.degree} · ${e.period} · ${e.note}`))),
      h("ul", {}, ...P.activities.map(a => h("li", {}, a)))),
    runtimeBox()
  );
}
function runtimeBox() {
  const box = h("div", { class: "runtime", id: "runtime" });
  const paint = () => box.replaceChildren(
    INFO ? h("span", {}, "이 페이지는 ", h("b", {}, INFO.podName), ` (namespace ${INFO.namespace}, node ${INFO.nodeName}) 에서 응답했습니다. `)
         : "Pod 정보를 불러오지 못했습니다. ",
    h("button", { type: "button", onclick: async () => { await refreshInfo(); paint(); } }, "다시 요청하기"),
    h("br"), "Red Hat OpenShift · ubi9/python-311 · ConfigMap / Secret / Downward API / Probes");
  paint();
  return box;
}

/* ── boot ────────────────────────────────────────── */
const BIG = ["        __                              ", "  _____/ /_  ____ ____  ___  ____  ____ ", " / ___/ __ \\/ __ `/ _ \\/ _ \\/ __ \\/ __ \\", "/ /__/ / / / /_/ /  __/  __/ /_/ / / / /", "\\___/_/ /_/\\__,_/\\___/\\___/\\____/_/ /_/ "].join("\n");
const SMALL = ["    _                          ", " __| |_  __ _ ___ ___ ___ _ _  ", "/ _| ' \\/ _` / -_) -_) _ \\ ' \\ ", "\\__|_||_\\__,_\\___\\___\\___/_||_|"].join("\n");
function printBanner() {
  out.append(h("div", { class: "banner big", "aria-label": "chaeeon" }, BIG), h("div", { class: "banner small", "aria-hidden": "true" }, SMALL));
}

async function boot() {
  applyTheme(store.get("theme") || "sim");
  setPrompt();
  const [prof, info] = await Promise.allSettled([api("/api/profile"), refreshInfo()]);
  if (prof.status === "fulfilled" && prof.value.ok) P = prof.value.body;
  if (!store.get("theme") && INFO && ["sim","paper","phosphor"].includes(INFO.defaultTheme)) applyTheme(INFO.defaultTheme);

  if (location.hash === "#portfolio") { setMode("gui"); }

  const steps = [
    () => line(span("dim", "[  ok  ] route  → service/chaeeon-cv:8080")),
    () => line(span("dim", "[  ok  ] serving from "), span("podc", INFO ? INFO.podName : "unknown pod"), span("dim", INFO ? `  (ns ${INFO.namespace})` : "")),
    () => line(span(P ? "dim" : "err", P ? "[  ok  ] mounted configmap/chaeeon-cv-profile → profile.json" : "[ fail ] profile.json not found"))
  ];
  for (const s of steps) { s(); await sleep(140); }
  blank();
  printBanner();
  if (P) {
    line(span("h", `${P.name} · ${P.nameKo}`), span("dim", `  —  ${P.headline}`));
    line(INFO && INFO.welcome ? INFO.welcome : P.taglineKo);
    blank();
    line("시작하려면 ", cmdLink("help"), " 를 입력하거나 아래 버튼을 눌러보세요. 일반 화면이 편하면 ", cmdLink("gui"), ".");
  }
  blank();
  scroll();
  if (!$("app").classList.contains("mode-gui") && matchMedia("(pointer: fine)").matches) input.focus({ preventScroll: true });
}
boot();
})();
